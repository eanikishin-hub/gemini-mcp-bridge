[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "most-gemini"
version = "0.1.0"
description = "Мост: Claude работает с Gemini (картинки Nano Banana, чаты) через подписку владельца"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    # Закреплённая версия: чужой код сам не обновляется. Обновлять руками, прочитав изменения.
    "gemini-webapi @ git+https://github.com/HanaokaYuzu/Gemini-API@8c5b1dcbf54ecf093551cc20bd25cef438190ba8",
    "mcp>=1.30,<1.31",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Только для ярлыка «Вход в Gemini» на рабочем столе сервера.
login = ["playwright>=1.50"]

[project.scripts]
most-gemini = "most_gemini.server:main"
most-gemini-login = "most_gemini.login:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/most_gemini"]
